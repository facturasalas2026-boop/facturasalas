<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de Facturación Diaria — ALAS</title>
  <meta name="description" content="Tablero de Facturación Diaria — ALAS Sistema Logístico" />
  <meta name="theme-color" content="#0B5F8D" />
  <link rel="icon" type="image/png" href="logo-alas-s.a.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Librerías -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Datos (Supabase) -->
  <script src="supabase-config.js"></script>
  <script src="db-api.js"></script>

  <!-- Canónicos ALAS -->
  <script src="alas-transition.js"></script>
  <script src="alas-sso-config.js"></script>
  <script src="alas-auth-client.js"></script>
  <script src="tablero-login.js"></script>
  <script src="ui-protection.js" defer></script>
</head>
<body>

  <!-- Loader de entrada (circular canónico del launcher) -->
  <div id="loader" class="loader" role="status" aria-label="Cargando">
    <div class="loader__stage">
      <svg class="loader__svg" width="272" height="272" viewBox="0 0 272 272" aria-hidden="true">
        <circle cx="136" cy="136" r="114" fill="none" stroke="rgba(11,95,141,.09)" stroke-width="1.5"/>
        <circle class="loader__arc" cx="136" cy="136" r="114" fill="none" stroke="#0B5F8D" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="loader__hub">
        <span class="loader__ring"></span>
        <span class="loader__surface"></span>
        <img src="logo-icon.png" alt="" class="loader__logo" draggable="false"/>
      </div>
    </div>
  </div>

  <div id="alas-root" class="layout">
    <div class="stage-shell">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar__logo"><img src="logo-icon.png" alt="ALAS" /></div>
        <nav class="sidebar__nav">
          <button class="nav-btn is-active" type="button" data-nav="principal">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
            <span class="nav-btn__lbl">Facturación diaria</span>
          </button>
          <button class="nav-btn" type="button" data-nav="mesames">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg></span>
            <span class="nav-btn__lbl">Mes a mes</span>
          </button>
          <button class="nav-btn" type="button" data-nav="pedidos">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg></span>
            <span class="nav-btn__lbl">Pedidos pend.</span>
          </button>
          <button class="nav-btn" type="button" data-nav="config">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg></span>
            <span class="nav-btn__lbl">Días hábiles</span>
          </button>
        </nav>
        <div class="sidebar__bottom">
          <div class="sidebar__user" id="userChip" hidden>
            <span class="sidebar__user-ico"><svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="sidebar__user-txt"><span id="userName">—</span><span class="sidebar__user-role" id="userRole"></span></span>
          </div>
          <button class="nav-btn nav-btn--back" type="button" id="btnBack" title="Volver al launcher">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
            <span class="nav-btn__lbl">Menú</span>
          </button>
        </div>
      </aside>

      <!-- Contenido -->
      <main class="main">
        <div id="stage"></div>
      </main>

    </div>
  </div>

  <!-- Input oculto para cargar la base (solo admin) -->
  <input type="file" id="fileBase" accept=".xlsx,.xls" hidden />

  <script>
    /* ── ALASTransition + volver al launcher ── */
    if (window.ALASTransition) ALASTransition.init({ root: '#alas-root' });
    function alasGoToLauncher() {
      var url = (window.ALAS_SSO_CONFIG && ALAS_SSO_CONFIG.launcherUrl) || 'https://launcher-tawny.vercel.app';
      if (window.ALASTransition) ALASTransition.exitToLauncher(url); else window.location.href = url;
    }
    document.getElementById('btnBack').addEventListener('click', alasGoToLauncher);

    /* ── Revela el contenido y oculta el loader (idempotente) ── */
    function alasReveal() {
      var l = document.getElementById('loader');
      if (l) l.classList.add('loader--hidden');
      var root = document.getElementById('alas-root');
      if (window.ALASTransition) ALASTransition.enterProject();
      if (root) { root.style.opacity = '1'; root.style.transform = 'none'; root.style.filter = 'none'; }
    }

    /* ── Boot: esperar SSO (con timeout), mostrar usuario, revelar ── */
    var _revealed = false;
    function bootReveal() { if (_revealed) return; _revealed = true; alasReveal(); if (window.__initTablero) window.__initTablero(); }
    (window.__tableroAuthReady || window.__alasAuthReady || Promise.resolve()).then(function () {
      var c = window.AlasAuthClient;
      if (c && c.isAuthenticated) {
        document.getElementById('userName').textContent = c.getCurrentUser();
        var role = c.getRole && c.getRole();
        if (role) { var r = document.getElementById('userRole'); r.textContent = role; r.hidden = false; }
        document.getElementById('userChip').hidden = false;
      }
      bootReveal();
    }).catch(bootReveal);
  </script>
  <script src="app.js"></script>
</body>
</html>
